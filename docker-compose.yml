services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: sos_maths
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: sos
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./install/database.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  dbdata:

